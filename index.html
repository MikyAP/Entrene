<!DOCTYPE html>

<meta charset="UTF-8">

<style>

<div class="wrap">
  <header><div class="title"><h1>Mi entreno</h1><span>Poli Malilla · Torso/Pierna</span></div><div class="nav" id="nav"></div></header>

const K3='mi-entreno-v3',K2='mi-entreno-v2',K1='mi-entreno-logs-v1';

  try{const v=localStorage.getItem(k);if(v!=null)return v;}catch(e){}return (k in mem)?mem[k]:null;},

const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>dkey(new Date());
function migrateFlat(logs,pool){const nd={days:{},hidden:{}};
  ['A','B','C'].forEach(sid=>{const lg=logs[sid]||{};Object.entries(lg).forEach(([id,rec])=>{const dt=rec.ts?dkey(new Date(rec.ts)):todayKey();nd.days[dt]=nd.days[dt]||{};nd.days[dt][sid]=nd.days[dt][sid]||{};nd.days[dt][sid][id]={sets:rec.sets||[]};});});
  if(pool&&pool.largos){const dt=pool.ts?dkey(new Date(pool.ts)):todayKey();nd.days[dt]=nd.days[dt]||{};nd.days[dt].POOL={largos:pool.largos};}
  return nd;}
function normalize(){data.days=data.days||{};data.hidden=data.hidden||{};}
function migratePlan(){ /* plan antiguo Empuje/Tirón/Pierna (A/B/C) -> etiquetas de solo lectura */
  if(data.v>=4)return false;
  const map={A:'PUSH',B:'PULL',C:'LEGS'};
  Object.keys(data.days).forEach(dt=>{const d=data.days[dt];const nd={};
    Object.keys(d).forEach(k=>{
      if(map[k])nd[map[k]]=d[k];
      else if(k==='meta'){const nm={};Object.keys(d.meta||{}).forEach(mk=>{nm[map[mk]||mk]=d.meta[mk];});nd.meta=nm;}
      else nd[k]=d[k];});
    data.days[dt]=nd;});
  const nh={};Object.keys(data.hidden||{}).forEach(h=>{const [s,id]=h.split('|');nh[(map[s]||s)+'|'+id]=data.hidden[h];});data.hidden=nh;
  data.v=4;return true;
}
async function loadData(){
  let v=await raw.get(K3);
  if(v){try{data=JSON.parse(v);}catch(e){}}
  else{const v2=await raw.get(K2);
    if(v2){try{const o=JSON.parse(v2);data=migrateFlat(o.logs||{},o.pool||{});}catch(e){}}
    else{const v1=await raw.get(K1);if(v1){try{const o=JSON.parse(v1);data=migrateFlat({A:o.A,B:o.B,C:o.C},o.POOL||{});}catch(e){}}}}
  normalize();
  if(!data.v&&Object.keys(data.days).length===0)data.v=4;
  if(migratePlan()||!v)await raw.set(K3,JSON.stringify(data));
}
let st=null;function queueSave(){clearTimeout(st);st=setTimeout(()=>raw.set(K3,JSON.stringify(data)),350);}
function flush(){clearTimeout(st);raw.set(K3,JSON.stringify(data));}

function ensureRec(dt,sid,id){data.days[dt]=data.days[dt]||{};data.days[dt][sid]=data.days[dt][sid]||{};
  if(!data.days[dt][sid][id]){const it=EX[id]||{scheme:'3'};data.days[dt][sid][id]={sets:Array.from({length:defaultSets(it)},()=>({}))};}
  return data.days[dt][sid][id];}
function filled(rec){return !!(rec&&rec.sets&&rec.sets.some(s=>s.a||s.b));}
function workSets(rec){return (rec&&rec.sets?rec.sets:[]).filter(s=>!s.w&&(s.a||s.b));}
function workFilled(rec){return workSets(rec).length>0;}
function metaHasData(dt,sid){const mm=(data.days[dt]&&data.days[dt].meta&&data.days[dt].meta[sid])||{};return !!(mm.dur||mm.kcal||mm.hr);}
function getMeta(dt,sid){return (data.days[dt]&&data.days[dt].meta&&data.days[dt].meta[sid])||{};}
function setMeta(dt,sid,f,v){data.days[dt]=data.days[dt]||{};data.days[dt].meta=data.days[dt].meta||{};data.days[dt].meta[sid]=data.days[dt].meta[sid]||{};if(v)data.days[dt].meta[sid][f]=v;else delete data.days[dt].meta[sid][f];queueSave();}
function daySessions(dt){const d=data.days[dt]||{};const out=ALLS.filter(k=>(d[k]&&Object.values(d[k]).some(filled))||metaHasData(dt,k));

/* "Anterior" = último registro de ese ejercicio EN LA MISMA SESIÓN (A/B/C/D).
   Solo si nunca se ha hecho en esa sesión se muestra, como referencia, el plan antiguo (PUSH/PULL/LEGS). */
function prevRecord(sid,id,before){const ds=Object.keys(data.days).filter(d=>d<before).sort().reverse();
  for(const d of ds){const r=((data.days[d]||{})[sid]||{})[id];if(workFilled(r))return{date:d,rec:r,sid};}
  for(const d of ds){for(const k of ['PUSH','PULL','LEGS']){const r=((data.days[d]||{})[k]||{})[id];if(workFilled(r))return{date:d,rec:r,sid:k,legacy:true};}}
  return null;}
function fmtSet(s,type,long){
  const rir=(s.r!==undefined&&s.r!=='')?(long?` (RIR ${s.r})`:` @${s.r}`):'';
  if(type==='time')return (s.a||'—')+'s';
  if(type==='reps')return (s.a||'—')+(long?' reps':'')+rir;
  return (s.a||'—')+'kg×'+(s.b||'—')+rir;}
function fmtWork(rec,type,long){return workSets(rec).map(s=>fmtSet(s,type,long)).join(long?', ':'  ·  ');}
function shiftDate(k,delta){const d=new Date(k+'T12:00');d.setDate(d.getDate()+delta);return dkey(d);}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function topRep(scheme,type){if(type==='time')return null;const seg=scheme.split('×')[1]||'';const nums=(seg.match(/\d+/g)||[]).map(Number);if(!nums.length)return null;return nums.length>1?nums[1]:nums[0];}
/* ↑ sube peso: solo con el registro de la MISMA sesión, TODAS las series de trabajo previstas
   registradas (mínimo el nº del esquema; si hiciste 4, las 4), sin contar calentamiento, y todas en el tope. */
function needUp(it,type,prev){if(type==='time'||!prev||prev.legacy)return false;const top=topRep(it.scheme,type);if(!top)return false;
  const f=type==='weight'?'b':'a';const rows=(prev.rec.sets||[]).filter(s=>!s.w);const planned=Math.max(defaultSets(it),rows.length);
  const done=rows.filter(s=>s[f]!==undefined&&s[f]!==''&&(type!=='weight'||(s.a!==undefined&&s.a!=='')));
  if(done.length<planned)return false;return done.every(s=>(parseInt(s[f],10)||0)>=top);}
/* Mejor marca histórica del ejercicio (todas las sesiones, plan antiguo incluido), sin contar el día que estás viendo ni calentamientos.
   Peso: la serie de más peso y, con ese peso, la de más repeticiones. */
function prOf(id,type,before){let best=null;
  Object.keys(data.days).filter(d=>d<before).forEach(dt=>{ALLS.forEach(k=>{const r=((data.days[dt]||{})[k]||{})[id];
    workSets(r).forEach(x=>{const a=parseFloat(String(x.a||'').replace(',','.'))||0,b=parseInt(x.b,10)||0;
      if(type==='weight'){if(!a||!b)return;if(!best||a>best.a||(a===best.a&&b>best.b))best={a,b};}
      else{if(!a)return;if(!best||a>best.a)best={a};}});});});
  if(!best)return '';
  return type==='weight'?`${best.a} kg × ${best.b}`:type==='time'?`${best.a} s`:`${best.a} reps`;}
function mixedWeights(rec){const ws=workSets(rec).map(s=>parseFloat(String(s.a||'').replace(',','.'))).filter(v=>!isNaN(v));return new Set(ws).size>1;}
function isHidden(sid,id){return !!data.hidden[sid+'|'+id];}
function lastMeta(sid){const ds=Object.keys(data.days).sort();let out=null;ds.forEach(dt=>{const mm=(data.days[dt].meta||{})[sid];if(mm&&(mm.dur||mm.kcal||mm.hr))out={dur:mm.dur,kcal:mm.kcal,hr:mm.hr,date:dt};});return out;}
function lastPool(){const ds=Object.keys(data.days).sort();let out=null;ds.forEach(dt=>{const p=data.days[dt].POOL;const mm=(data.days[dt].meta||{}).POOL;if((p&&p.largos)||(mm&&(mm.dur||mm.kcal||mm.hr)))out={largos:p&&p.largos,date:dt};});return out;}
function metaLine(sid,largos){const mm=lastMeta(sid);const parts=[];if(largos)parts.push(`🏊 <b>${largos}</b> largos`);
  if(mm){if(mm.dur)parts.push(`⏱ <b>${mm.dur}</b> min`);if(mm.kcal)parts.push(`🔥 <b>${mm.kcal}</b> kcal`);if(mm.hr)parts.push(`❤ <b>${mm.hr}</b> ppm`);}
  if(!parts.length)return'';const dt=(mm&&mm.date)||'';const dd=dt?new Date(dt+'T12:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}):'';
  return `<div class="metaline">${parts.join(' · ')}${dd?` <span style="opacity:.7">(${dd})</span>`:''}</div>`;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ===== PLAN: sesiones completadas, ciclos, fases y rotación (sin semanas de calendario) ===== */
const PLAN=['A','B','C','D'];

const PHASES={1:{name:'Calibración',range:'1-8',txt:'RIR ~3 · aprende técnica y máquinas · 3 series también en los ⭐ · mismo peso en las series de trabajo.'},
 2:{name:'Progresión',range:'9-24',txt:'RIR 2-3 en ⭐ y 1-2 en accesorios · los ⭐ pueden pasar a 4 series si recuperas bien · sube peso solo con todas las series en el tope del rango.'},
 3:{name:'Revisión',range:'25+',txt:'Revisa cómo vas antes de seguir. La app no cambia nada sola.'}};
function shortName(k){return (SESSIONS[k]&&SESSIONS[k].name.split(' · ')[0])||k;}
/* Una sesión cuenta como completada SOLO cuando se pulsa "Finalizar sesión" (days[fecha].fin[sesión]). */
function sessionHasWork(dt,sid){const s=(data.days[dt]||{})[sid];return !!(s&&Object.values(s).some(workFilled));}
function sessionDone(dt,sid){return !!(((data.days[dt]||{}).fin||{})[sid]);}
function setDone(dt,sid,on){data.days[dt]=data.days[dt]||{};const f=data.days[dt].fin=data.days[dt].fin||{};if(on)f[sid]=1;else{delete f[sid];if(!Object.keys(f).length)delete data.days[dt].fin;}flush();}
function planLog(){const out=[];Object.keys(data.days).sort().forEach(dt=>PLAN.forEach(k=>{if(sessionDone(dt,k))out.push({dt,sid:k});}));return out;}
function nextSid(sid){return PLAN[(PLAN.indexOf(sid)+1)%PLAN.length];}
function phaseOf(n){return n<=8?1:n<=24?2:3;}
function planStatus(){const log=planLog();const t=todayKey();const today=log.filter(x=>x.dt===t);
  const inProg=PLAN.filter(k=>sessionHasWork(t,k)&&!sessionDone(t,k));
  const last=log[log.length-1];return{log,done:log.length,today,inProg,next:last?nextSid(last.sid):'A'};}
function sessNumber(dt,sid){const i=planLog().findIndex(x=>x.dt===dt&&x.sid===sid);return i<0?null:i+1;}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);}
function staleInfo(){const log=planLog();if(!log.length)return[];const t=todayKey();const since=daysBetween(log[0].dt,t);
  return PLAN.map(sid=>{const l=[...log].reverse().find(x=>x.sid===sid);const days=l?daysBetween(l.dt,t):null;
    return{sid,days,never:!l,stale:l?days>STALE_DAYS:since>STALE_DAYS};});}

  return `<button class="finish" data-finish="1">✓ Finalizar sesión ${current} · ${shortName(current)}</button><div class="finish-sub">Solo al finalizar avanza el contador, la rotación y las fases.</div>`;}

function statusHTML(){const st=planStatus();const todays=st.today.map(x=>x.sid);

function exposures(sid,id){return Object.keys(data.days).sort().map(dt=>((data.days[dt]||{})[sid]||{})[id]).filter(workFilled);}
function expScore(rec){const ws=workSets(rec).filter(s=>s.a&&s.b);if(!ws.length)return null;const mx=Math.max(...ws.map(s=>parseFloat(s.a)||0));

function renderCalendar(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  const monName=calMonth.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let h=`<div class="cal-head"><button data-mv="-1" aria-label="Mes anterior">‹</button><div class="mon">${monName}</div><button data-mv="1" aria-label="Mes siguiente">›</button></div>`;
  h+=`<div class="cal-grid">`+['L','M','X','J','V','S','D'].map(d=>`<div class="cal-wd">${d}</div>`).join('');
  for(let i=0;i<start;i++)h+=`<div class="cal-cell empty"></div>`;
  const tk=todayKey();
  for(let d=1;d<=days;d++){const key=`${y}-${pad(m+1)}-${pad(d)}`;const sess=daySessions(key);const dots=sess.map(s=>`<i style="background:${SCOL[s]}"></i>`).join('');
    h+=`<div class="cal-cell${sess.length?' has':''}${key===tk?' today':''}${key===selDay?' sel':''}" data-day="${key}"><span class="dnum">${d}</span><div class="cal-dots">${dots}</div></div>`;}
  h+=`</div>`;
  h+=selDay?dayPreview(selDay):`<div class="cal-hint">Toca un día para ver lo que hiciste.<br>Los puntos de color son las sesiones registradas (gris = plan anterior).</div>`;
  viewEl.innerHTML=h;
  viewEl.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{calMonth=new Date(y,m+parseInt(b.dataset.mv,10),1);renderCalendar();});
  viewEl.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{selDay=(selDay===c.dataset.day?null:c.dataset.day);renderCalendar();});
  const ob=viewEl.querySelector('[data-open]');if(ob)ob.onclick=()=>{activeDate=ob.dataset.open;const sess=daySessions(activeDate).filter(s=>SKEYS.includes(s)&&s!=='POOL');if(sess.length)current=sess[0];view='entreno';render();};
}
function dayPreview(dt){
  const d=data.days[dt]||{};const sess=daySessions(dt);
  const dd=cap(new Date(dt+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}));
  let inner='';
  sess.forEach(sid=>{
    if(sid==='POOL'){const p=d.POOL||{};const mm=getMeta(dt,'POOL');const bits=[];if(p.largos)bits.push(`${esc(p.largos)} largos`);if(mm.dur)bits.push(`${esc(mm.dur)} min`);if(mm.kcal)bits.push(`${esc(mm.kcal)} kcal`);if(mm.hr)bits.push(`${esc(mm.hr)} ppm`);
      inner+=`<div class="cp-sess" style="color:${SCOL.POOL}">🏊 Piscina</div><div class="cp-ex"><span>${bits.join(' · ')||'—'}</span><span></span></div>`;return;}
    const s=d[sid]||{};const mm=getMeta(dt,sid);const mb=[];if(mm.dur)mb.push(`${esc(mm.dur)} min`);if(mm.kcal)mb.push(`${esc(mm.kcal)} kcal`);if(mm.hr)mb.push(`${esc(mm.hr)} ppm`);
    const sn=PLAN.includes(sid)?sessNumber(dt,sid):null;
    inner+=`<div class="cp-sess" style="color:${SCOL[sid]}">${sessName(sid)}${sn?' · sesión '+sn:(PLAN.includes(sid)?' · sin finalizar':'')}${mb.length?` · ${mb.join(' · ')}`:''}</div>`;
    Object.keys(s).forEach(id=>{const r=s[id];if(!workFilled(r))return;const def=EX[id]||{name:id};inner+=`<div class="cp-ex"><span>${def.name}</span><span>${esc(fmtWork(r,def.type||'weight',false))}</span></div>`;});
  });
  if(d.post)inner+=`<div class="cp-sess" style="color:var(--good)">✓ Recuperación / estiramientos</div>`;
  if(d.note)inner+=`<div class="cp-note">📝 ${esc(d.note)}</div>`;
  if(!inner)inner=`<p class="cp-empty">Nada registrado este día.</p>`;
  return `<div class="cal-prev"><h3>${dd}</h3>${inner}<button class="cp-open" data-open="${dt}">Abrir en Entreno</button></div>`;
}

function lastAndBest(sid,id,type){const ds=Object.keys(data.days).sort();let last=null,legacy=null,best=0;
  ds.forEach(dt=>{ALLS.forEach(k=>{const r=((data.days[dt]||{})[k]||{})[id];if(workFilled(r)){if(k===sid)last=r;else if(LEGACY[k])legacy=r;if(type==='weight')workSets(r).forEach(s=>{const v=parseFloat(s.a)||0;if(v>best)best=v;});}});});
  return{last:last||legacy,fromLegacy:!last&&!!legacy,best};}
function planSummaryHTML(){const st=planStatus();const n=st.today.length?st.done:st.done+1;const ph=phaseOf(n);const stale=staleInfo();
  const rows=PLAN.map(sid=>{const x=stale.find(y=>y.sid===sid);const txt=!x||x.never?'sin registrar':(x.days===0?'hoy':x.days===1?'hace 1 día':`hace ${x.days} días`);
    return `<div class="sumrow"><span class="nm">${sid} · ${shortName(sid)}</span><span class="vl"><b>${txt}</b>${x&&x.stale?' ⚠':''}</span></div>`;}).join('');
  const arms=armStall();
  const armTxt=arms.length?`⚠ ${arms.map(a=>a.name+' ('+a.sid+')').join(', ')}: 3 sesiones sin progresar. Si la técnica, el sueño y la comida van bien y no hay molestias, puedes valorar el bloque opcional de brazos en D. La decisión es tuya.`:'Sin señales de estancamiento en brazos: no hace falta volumen extra.';
  return `<div class="sumsec"><h3>📈 Plan</h3>
    <div class="stat-row" style="margin:0 0 10px"><div class="stat"><div class="big">${st.done}</div><div class="lbl">sesiones del plan</div></div><div class="stat"><div class="big">${Math.floor((n-1)/4)+1}</div><div class="lbl">ciclo</div></div><div class="stat"><div class="big">${ph}</div><div class="lbl">fase · ${PHASES[ph].name}</div></div></div>
    <div class="metaline">Toca: <b>${st.next} · ${shortName(st.next)}</b> · Última vez que hiciste cada sesión:</div>
    ${rows}
    <div class="armnote">💪 ${armTxt}</div>${ph===3?reviewHTML():''}</div>`;}
function buildReport(){
  const days=Object.keys(data.days).sort();
  let out='SEGUIMIENTO DE ENTRENAMIENTO\n'+'='.repeat(32)+'\n(solo series de trabajo; el calentamiento no se incluye)\n\n';
  let any=false;
  days.forEach(dt=>{
    const d=data.days[dt];const sess=daySessions(dt);if(!sess.length&&!d.post&&!d.note)return;any=true;
    const dd=new Date(dt+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    out+=dd.toUpperCase()+'\n'+'-'.repeat(dd.length)+'\n';
    sess.forEach(sid=>{
      if(sid==='POOL'){const p=d.POOL||{};const mm=getMeta(dt,'POOL');const bits=[];if(p.largos)bits.push(p.largos+' largos');if(mm.dur)bits.push(mm.dur+' min');if(mm.kcal)bits.push(mm.kcal+' kcal');if(mm.hr)bits.push(mm.hr+' ppm');
        out+='Piscina: '+(bits.join(' · ')||'—')+'\n';return;}
      const mm=getMeta(dt,sid);const mb=[];if(mm.dur)mb.push(mm.dur+' min');if(mm.kcal)mb.push(mm.kcal+' kcal');if(mm.hr)mb.push(mm.hr+' ppm');
      const sn=PLAN.includes(sid)?sessNumber(dt,sid):null;
      out+=sessName(sid)+(sn?' — sesión '+sn+' del plan':(PLAN.includes(sid)?' — sin finalizar':''))+(mb.length?' ('+mb.join(' · ')+')':'')+'\n';
      Object.keys(d[sid]||{}).forEach(id=>{const r=d[sid][id];if(!workFilled(r))return;const def=EX[id]||{name:id};
        out+='  - '+def.name+(def.star?' [principal]':'')+': '+fmtWork(r,def.type||'weight',true)+'\n';});
    });
    if(d.post)out+='Recuperación / estiramientos: hecho\n';
    if(d.note)out+='Nota: '+d.note+'\n';
    out+='\n';
  });
  return any?out.trim()+'\n':'Sin datos registrados todavía.';
}
function renderResumen(){
  const now=new Date();const ws=new Date(now);ws.setDate(now.getDate()-((now.getDay()+6)%7));ws.setHours(0,0,0,0);
  const mk=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  let weekDays=0,monthSess=0,totalSess=0,monthMin=0,monthKcal=0;
  Object.keys(data.days).forEach(dt=>{const sess=daySessions(dt);totalSess+=sess.length;if(dt.startsWith(mk))monthSess+=sess.length;
    const d=new Date(dt+'T12:00');if(d>=ws&&d<=now&&sess.length)weekDays++;
    if(dt.startsWith(mk)){const mt=(data.days[dt].meta)||{};Object.values(mt).forEach(mm=>{monthMin+=parseInt(mm.dur,10)||0;monthKcal+=parseInt(mm.kcal,10)||0;});}});
  let h=`<div class="stat-row">
    <div class="stat"><div class="big">${weekDays}</div><div class="lbl">días esta semana</div></div>
    <div class="stat"><div class="big">${monthSess}</div><div class="lbl">sesiones este mes</div></div>
    <div class="stat"><div class="big">${totalSess}</div><div class="lbl">sesiones total</div></div></div>
    <div class="stat-row">
    <div class="stat"><div class="big">${monthMin}</div><div class="lbl">min este mes</div></div>
    <div class="stat"><div class="big">${monthKcal}</div><div class="lbl">kcal este mes</div></div></div>`;
  h=planSummaryHTML()+h;
  ['A','B','C','D','GRIP'].forEach(sid=>{let rows='';
    SESSIONS[sid].items.forEach(it=>{if(it.opt)return;const type=it.type||'weight';const {last,fromLegacy,best}=lastAndBest(sid,it.id,type);
      const lastTxt=last?fmtWork(last,type,false)+(fromLegacy?' (plan antiguo)':''):'—';const bestTxt=best>0?` · máx histórico ${best}kg`:'';
      rows+=`<div class="sumrow"><span class="nm">${it.star?'⭐ ':''}${it.name}</span><span class="vl"><b>${esc(lastTxt)}</b>${bestTxt}</span></div>`;});
    h+=`<div class="sumsec"><h3><i style="background:${SCOL[sid]}"></i>${SESSIONS[sid].name}</h3>${metaLine(sid)}${rows}</div>`;});
  const pm=lastPool();if(pm)h+=`<div class="sumsec"><h3><i style="background:${SCOL.POOL}"></i>Piscina</h3>${metaLine('POOL',pm.largos)}</div>`;
  h+=`<div class="backup"><h3>Exportar para compartir</h3>
    <p>Texto legible con todos tus días (solo series de trabajo con su RIR, tiempo, calorías y pulsaciones) para pasárselo a alguien.</p>
    <textarea id="txtBox" readonly>${esc(buildReport())}</textarea>
    <div class="bbtns"><button id="txtCopy">Copiar texto</button><button id="txtDl">Descargar .txt</button></div>
    <div class="bmsg" id="txtmsg"></div></div>`;
  h+=`<div class="backup"><h3>Copia de seguridad</h3>
    <p>Guarda este texto en sitio seguro (notas, email…). Restáuralo aquí si cambias de móvil o se pierden los datos.</p>
    <textarea id="expBox" readonly>${esc(JSON.stringify(data))}</textarea>
    <div class="bbtns"><button id="copyBtn">Copiar</button><button id="dlBtn">Descargar</button></div>
    <p>Pega aquí una copia para restaurar:</p><textarea id="impBox" placeholder='{"days":...}'></textarea>
    <div class="bbtns"><button id="impBtn">Restaurar copia</button></div><div class="bmsg" id="bmsg"></div></div>`;
  viewEl.innerHTML=h;
  const copyFrom=async(id,cb)=>{const t=document.getElementById(id);try{await navigator.clipboard.writeText(t.value);cb('Copiado ✓');}catch(e){t.select();try{document.execCommand('copy');cb('Copiado ✓');}catch(_){cb('No se pudo copiar',1);}}};
  const dlFrom=(id,name,type,cb)=>{try{const b=new Blob([document.getElementById(id).value],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);cb('Descargando ✓');}catch(e){cb('No se pudo; usa Copiar',1);}};
  document.getElementById('txtCopy').onclick=()=>copyFrom('txtBox',tmsg);
  document.getElementById('txtDl').onclick=()=>dlFrom('txtBox','mi-entreno.txt','text/plain',tmsg);
  document.getElementById('copyBtn').onclick=()=>copyFrom('expBox',msg);
  document.getElementById('dlBtn').onclick=()=>dlFrom('expBox','mi-entreno-backup.json','application/json',msg);
  document.getElementById('impBtn').onclick=()=>{const v=document.getElementById('impBox').value.trim();if(!v){msg('Pega una copia primero',1);return;}
    try{const o=JSON.parse(v);if(!o.days)throw 0;data=o;normalize();migratePlan();raw.set(K3,JSON.stringify(data));msg('Datos restaurados ✓');setTimeout(()=>renderResumen(),600);}catch(e){msg('Copia no válida',1);}};
}
function msg(t,err){const m=document.getElementById('bmsg');if(!m)return;m.textContent=t;m.className='bmsg'+(err?' err':'');}

let rInt=null,rLeft=0;
function fmtT(s){return Math.floor(s/60)+':'+pad(Math.max(0,s%60));}
function restShow(run){document.querySelector('#rest .rest-idle').classList.toggle('hide',run);document.querySelector('#rest .rest-run').classList.toggle('hide',!run);}
function updRestNum(){const n=document.getElementById('restNum');if(n)n.textContent=fmtT(rLeft);}
function startRest(sec){if(rInt)clearInterval(rInt);rLeft=sec;restShow(true);updRestNum();rInt=setInterval(()=>{rLeft--;if(rLeft<=0)finishRest();else updRestNum();},1000);}
function stopRest(){if(rInt){clearInterval(rInt);rInt=null;}restShow(false);}
function beep(){try{const Ctx=window.AudioContext||window.webkitAudioContext;const c=new Ctx();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;o.start();g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.4);o.stop(c.currentTime+.42);}catch(e){}}
function finishRest(){if(rInt){clearInterval(rInt);rInt=null;}beep();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}const n=document.getElementById('restNum');if(n)n.textContent='¡Ya!';setTimeout(()=>restShow(false),1500);}
function updateRestBar(){const r=document.getElementById('rest');if(!r)return;r.classList.toggle('hide',!((view==='entreno'&&current!=='POOL')||view==='post'));}
document.querySelectorAll('#rest [data-rest]').forEach(b=>b.onclick=()=>startRest(parseInt(b.dataset.rest,10)));
document.getElementById('restStop').onclick=()=>stopRest();
document.getElementById('restAdd').onclick=()=>{rLeft+=15;updRestNum();};

(async()=>{await loadData();const st=planStatus();current=st.today.length?st.today[st.today.length-1].sid:(st.inProg.length?st.inProg[0]:st.next);render();})();
</script>
