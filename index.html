<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi entreno — Poli Malilla</title>
<style>
  :root{--ink:#14161B;--panel:#1E222B;--panel2:#262C37;--line:#333B47;--text:#EEF1F4;--muted:#98A1AE;
    --work:#FF4D5E;--sec:#F49AA1;--rest:#39414D;--good:#35C67A;--A:#FF4D5E;--B:#FF9F3C;--C:#8A6BFF;--P:#2C9AD0;--r:14px;}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;padding:0 0 96px;line-height:1.4}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  header{position:sticky;top:0;z-index:20;background:var(--ink);padding:15px 0 0;border-bottom:1px solid var(--line)}
  .title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 11px}
  .title h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em} .title span{color:var(--muted);font-size:13px;font-weight:500}
  .nav{display:flex;gap:4px}
  .nav button{flex:1;min-height:42px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;font-weight:700;cursor:pointer;padding:0 0 8px}
  .nav button.on{color:var(--text);border-bottom-color:var(--work)}
  .datebar{display:flex;align-items:center;gap:8px;margin:14px 0 2px}
  .datebar button{width:44px;min-height:44px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:18px;cursor:pointer}
  .datebar .dlabel{flex:1;text-align:center;font-size:14.5px;font-weight:700;text-transform:capitalize}
  .datebar .dlabel small{display:block;font-size:11px;font-weight:600;color:var(--good);text-transform:none}
  .tohoy{display:block;margin:8px auto 0;background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;min-height:34px;padding:0 14px;font-size:12.5px;font-weight:600;cursor:pointer}
  .subtabs{display:flex;gap:7px;margin:12px 0 2px}
  .tab{flex:1;min-height:44px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s ease}
  .tab:active{transform:scale(.97)} .tab.on{color:#fff;border-color:transparent}
  .tab.on.a{background:var(--A)} .tab.on.b{background:var(--B)} .tab.on.c{background:var(--C)} .tab.on.p{background:var(--P)}
  .sstats{display:flex;gap:8px;margin:12px 0 2px}
  .sf{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 8px 10px;text-align:center}
  .sf label{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:5px;line-height:1.2}
  .sf input{width:100%;min-height:42px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;font-size:16px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  .sf input:focus{outline:2px solid var(--work);outline-offset:1px;border-color:var(--work)}
  .meta{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 4px}
  .meta .sub{font-size:13.5px;color:var(--muted)} .meta .prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums} .meta .prog b{color:var(--good)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 2px 0;padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:11px}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
  .ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
  .ex.up{border-color:rgba(53,198,122,.5)}
  .ex-top{display:flex;gap:12px} .figs{display:flex;gap:2px;flex:0 0 auto} .fig{width:50px;height:auto;display:block}
  .base{fill:#2A303A} .m{fill:var(--rest);transition:fill .15s ease}
  .ex-info{flex:1;min-width:0}
  .ex-name{font-size:16px;font-weight:700;margin:2px 0 4px;letter-spacing:-.01em}
  .up-badge{display:inline-block;font-size:11px;font-weight:700;color:#0c1a12;background:var(--good);padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
  .scheme{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--work);background:rgba(255,77,94,.12);padding:2px 8px;border-radius:7px}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .bdg{font-size:11.5px;padding:2px 7px;border-radius:6px;font-weight:600;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .bdg.p{color:#fff;background:rgba(255,77,94,.9);border-color:transparent} .bdg.s{color:#F49AA1;border-color:rgba(244,154,161,.4)}
  .cue{font-size:13px;color:var(--muted);margin:11px 0 0;padding:9px 11px;background:var(--panel2);border-radius:9px;border-left:3px solid var(--line)}
  .cue.warn{border-left-color:var(--work);color:#F6C7CB}
  .rec{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .rtag{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:34px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
  button.rtag{cursor:pointer;color:var(--text)} button.rest-tag:active{background:var(--line)}
  .rtag.demo{color:#7FB2FF;border-color:rgba(127,178,255,.35)}
  .sets{margin-top:12px}
  .set-head{font-size:11px;color:var(--muted);padding:0 2px 6px;font-weight:600;display:grid;gap:8px;grid-template-columns:20px 1fr 120px}
  .set-head.solo{grid-template-columns:20px 1fr}
  .set{display:grid;gap:8px;align-items:center;margin-bottom:8px;grid-template-columns:20px 1fr 120px}
  .set.solo{grid-template-columns:20px 1fr}
  .set .n{font-size:13px;color:var(--muted);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
  .set input{width:100%;min-height:44px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:16px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
  .set input:focus{outline:2px solid var(--work);outline-offset:1px;border-color:var(--work)} .set input.filled{border-color:#4A5563}
  .stp{display:flex;align-items:center;gap:4px} .stp input{width:100%;padding:0}
  .stp button{flex:0 0 34px;min-height:44px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:20px;font-weight:700;cursor:pointer;line-height:1}
  .stp button:active{background:var(--line)}
  .setctl{display:flex;gap:8px;margin-top:4px}
  .setctl button{flex:1;min-height:38px;background:none;border:1px dashed var(--line);color:var(--muted);border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer}
  .setctl button:active{background:var(--panel2)}
  .last{font-size:11.5px;color:var(--muted);margin-top:9px;padding-left:2px} .last b{color:var(--text);font-weight:600}
  .hidden-sec{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;margin:12px 0}
  .hidden-sec h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
  .hidden-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;padding:5px 0}
  .hidden-row button{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;min-height:34px;padding:0 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .note-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
  .note-card label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
  .note-card textarea{width:100%;min-height:60px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:14px;padding:9px;resize:vertical;font-family:inherit}
  .note-card textarea:focus{outline:2px solid var(--work);outline-offset:1px;border-color:var(--work)}

  .pool-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
  .pool-card h3{margin:0 0 10px;font-size:16px} .pool-list{margin:0;padding-left:18px} .pool-list li{margin:7px 0;font-size:14.5px;color:#D3D9E0}
  .pool-log{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
  .pool-log input{min-height:44px;width:84px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:16px;text-align:center;font-weight:600}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 12px}
  .cal-head button{width:42px;min-height:42px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:18px;cursor:pointer}
  .cal-head .mon{font-size:16px;font-weight:700;text-transform:capitalize}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px} .cal-wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
  .cal-cell{aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 0 0;cursor:pointer}
  .cal-cell.empty{background:none;border:none;cursor:default} .cal-cell.today{border-color:var(--text)}
  .cal-cell .dnum{font-size:12.5px;font-weight:600;color:var(--muted)} .cal-cell.has .dnum{color:var(--text)}
  .cal-dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center} .cal-dots i{width:7px;height:7px;border-radius:50%;display:block}
  .cal-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
  .cal-cell.sel{outline:2px solid var(--work);outline-offset:-1px}
  .cal-prev{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px 0}
  .cal-prev h3{margin:0 0 8px;font-size:15px;text-transform:capitalize}
  .cp-sess{font-size:13px;font-weight:700;margin:11px 0 4px}
  .cp-ex{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);padding:3px 0}
  .cp-ex span:last-child{color:var(--text);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .cp-empty{font-size:13px;color:var(--muted);margin:6px 0}
  .cp-note{font-size:12.5px;color:#D3D9E0;background:var(--panel2);border-radius:9px;padding:8px 10px;margin-top:10px}
  .cp-open{margin-top:13px;width:100%;min-height:44px;background:var(--work);border:none;color:#fff;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  .post-note{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px 0 4px;font-size:13.5px;color:#D3D9E0;line-height:1.5} .post-note b{color:var(--text)}
  .post-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;display:flex;align-items:center;gap:12px}
  .pi-info{flex:1;min-width:0} .pi-name{font-size:14.5px;font-weight:600} .pi-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .pi-go{flex:0 0 auto;min-height:42px;padding:0 14px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer} .pi-go:active{background:var(--line)}
  .pi-btns{display:flex;gap:6px;flex:0 0 auto}
  .pi-go.img{padding:0 12px;text-decoration:none;color:#7FB2FF;display:inline-flex;align-items:center;font-size:16px}
  .post-done{width:100%;min-height:48px;margin:16px 0 4px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
  .post-done.on{background:var(--good);border-color:transparent;color:#0c1a12}
  .stat-row{display:flex;gap:10px;margin:16px 0 6px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:center}
  .stat .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums} .stat .lbl{font-size:11.5px;color:var(--muted);margin-top:2px}
  .sumsec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
  .sumsec h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:7px} .sumsec h3 i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .metaline{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-2px 0 10px;padding-bottom:9px;border-bottom:1px solid var(--line)} .metaline b{color:var(--text);font-weight:700}
  .sumrow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)} .sumrow:first-of-type{border-top:none}
  .sumrow .nm{color:#D3D9E0} .sumrow .vl{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap} .sumrow .vl b{color:var(--text)}
  .backup{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
  .backup h3{margin:0 0 6px;font-size:14px} .backup p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
  .backup textarea{width:100%;min-height:70px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:12px;padding:8px;font-family:ui-monospace,monospace;resize:vertical}
  .bbtns{display:flex;gap:8px;margin:8px 0} .bbtns button{flex:1;min-height:42px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
  .bbtns button:active{background:var(--line)} .bmsg{font-size:12px;color:var(--good);min-height:16px;margin-top:2px} .bmsg.err{color:var(--work)}
  .save-note{text-align:center;font-size:12px;color:var(--muted);margin-top:16px} .save-note b{color:var(--good)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.6}

  .rest{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,22,27,.96);border-top:1px solid var(--line);backdrop-filter:blur(6px);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
  .rest .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
  .rest-idle{display:flex;align-items:center;gap:8px;width:100%}
  .rest-idle span{font-size:12.5px;color:var(--muted);font-weight:600;flex:0 0 auto}
  .rest-idle button{flex:1;min-height:42px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  .rest-run{display:flex;align-items:center;gap:8px;width:100%}
  .rest-run #restNum{flex:1;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .rest-run button{min-height:42px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
  .rest-run #restStop{background:var(--work);border-color:transparent;color:#fff}
  .rest.hide{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="title"><h1>Mi entreno</h1><span>Poli Malilla</span></div><div class="nav" id="nav"></div></header>
  <div id="view"></div>
  <footer>Sube el peso cuando completes las series con buena técnica.<br>Entrena con cabeza y descansa: así se progresa.</footer>
</div>
<div id="rest" class="rest hide"><div class="inner">
  <div class="rest-idle"><span>Descanso</span><button data-rest="60">60s</button><button data-rest="90">90s</button><button data-rest="120">2 min</button></div>
  <div class="rest-run hide"><button id="restAdd">+15s</button><span id="restNum">1:00</span><button id="restStop">Parar</button></div>
</div></div>
<style id="muscle-css"></style>
<script>
const FRONT=`<svg class="fig" viewBox="0 0 80 170" aria-hidden="true">
<circle class="base" cx="40" cy="14" r="9"/><rect class="base" x="37" y="22" width="6" height="5"/>
<path class="m m-traps" d="M30 25 L40 23 L40 31 L28 31 Z"/><path class="m m-traps" d="M50 25 L40 23 L40 31 L52 31 Z"/>
<ellipse class="m m-delts" cx="22" cy="37" rx="9" ry="8"/><ellipse class="m m-delts" cx="58" cy="37" rx="9" ry="8"/>
<rect class="m m-chest" x="28" y="31" width="11" height="14" rx="4"/><rect class="m m-chest" x="41" y="31" width="11" height="14" rx="4"/>
<ellipse class="m m-biceps" cx="17" cy="55" rx="6" ry="12"/><ellipse class="m m-biceps" cx="63" cy="55" rx="6" ry="12"/>
<ellipse class="m m-forearms" cx="14" cy="80" rx="5" ry="13"/><ellipse class="m m-forearms" cx="66" cy="80" rx="5" ry="13"/>
<rect class="m m-abs" x="34" y="46" width="12" height="26" rx="4"/>
<rect class="m m-obliques" x="28" y="48" width="5" height="20" rx="2"/><rect class="m m-obliques" x="47" y="48" width="5" height="20" rx="2"/>
<rect class="m m-quads" x="30" y="74" width="9" height="34" rx="4"/><rect class="m m-quads" x="41" y="74" width="9" height="34" rx="4"/>
<rect class="m m-calves" x="31" y="116" width="8" height="30" rx="4"/><rect class="m m-calves" x="41" y="116" width="8" height="30" rx="4"/></svg>`;
const BACK=`<svg class="fig" viewBox="0 0 80 170" aria-hidden="true">
<circle class="base" cx="40" cy="14" r="9"/><rect class="base" x="37" y="22" width="6" height="5"/>
<path class="m m-traps" d="M30 24 L50 24 L46 34 L34 34 Z"/>
<ellipse class="m m-reardelts" cx="22" cy="37" rx="9" ry="8"/><ellipse class="m m-reardelts" cx="58" cy="37" rx="9" ry="8"/>
<ellipse class="m m-triceps" cx="17" cy="55" rx="6" ry="12"/><ellipse class="m m-triceps" cx="63" cy="55" rx="6" ry="12"/>
<ellipse class="m m-forearms" cx="14" cy="80" rx="5" ry="13"/><ellipse class="m m-forearms" cx="66" cy="80" rx="5" ry="13"/>
<rect class="m m-upperback" x="33" y="34" width="14" height="12" rx="3"/>
<path class="m m-lats" d="M28 46 L38 47 L36 64 L30 59 Z"/><path class="m m-lats" d="M52 46 L42 47 L44 64 L50 59 Z"/>
<rect class="m m-lowerback" x="35" y="60" width="10" height="12" rx="3"/>
<rect class="m m-glutes" x="30" y="74" width="9" height="14" rx="4"/><rect class="m m-glutes" x="41" y="74" width="9" height="14" rx="4"/>
<rect class="m m-hamstrings" x="30" y="90" width="9" height="26" rx="4"/><rect class="m m-hamstrings" x="41" y="90" width="9" height="26" rx="4"/>
<rect class="m m-calves" x="31" y="118" width="8" height="28" rx="4"/><rect class="m m-calves" x="41" y="118" width="8" height="28" rx="4"/></svg>`;
const FIGS=`<div class="figs">${FRONT}${BACK}</div>`;
const KEYS=['traps','delts','chest','biceps','triceps','forearms','abs','obliques','lats','upperback','lowerback','glutes','quads','hamstrings','calves','reardelts'];
const LBL={traps:'Trapecio',delts:'Hombros',chest:'Pecho',biceps:'Bíceps',triceps:'Tríceps',forearms:'Antebrazo',abs:'Abdomen',obliques:'Oblicuos',lats:'Dorsal',upperback:'Espalda alta',lowerback:'Lumbar',glutes:'Glúteos',quads:'Cuádriceps',hamstrings:'Isquios',calves:'Gemelos',reardelts:'Hombro post.'};
(()=>{let c='';KEYS.forEach(k=>c+=`.ex[data-s~="${k}"] .m-${k}{fill:var(--sec)}`);KEYS.forEach(k=>c+=`.ex[data-p~="${k}"] .m-${k}{fill:var(--work)}`);document.getElementById('muscle-css').textContent=c;})();

const SESSIONS={
 A:{name:'Empuje · pecho, hombro, tríceps',items:[

const SKEYS=['A','B','C','POOL'];

const K3='mi-entreno-v3',K2='mi-entreno-v2',K1='mi-entreno-logs-v1';
let data={days:{},hidden:{}};
const mem={};
const raw={async get(k){try{if(window.storage){const r=await window.storage.get(k,false);if(r)return r.value;}}catch(e){}
  try{const v=localStorage.getItem(k);if(v!=null)return v;}catch(e){}return (k in mem)?mem[k]:null;},
 async set(k,v){mem[k]=v;try{localStorage.setItem(k,v);}catch(e){}try{if(window.storage){await window.storage.set(k,v,false);}}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>dkey(new Date());
function migrateFlat(logs,pool){const nd={days:{},hidden:{}};
  ['A','B','C'].forEach(sid=>{const lg=logs[sid]||{};Object.entries(lg).forEach(([id,rec])=>{const dt=rec.ts?dkey(new Date(rec.ts)):todayKey();nd.days[dt]=nd.days[dt]||{};nd.days[dt][sid]=nd.days[dt][sid]||{};nd.days[dt][sid][id]={sets:rec.sets||[]};});});
  if(pool&&pool.largos){const dt=pool.ts?dkey(new Date(pool.ts)):todayKey();nd.days[dt]=nd.days[dt]||{};nd.days[dt].POOL={largos:pool.largos};}
  return nd;}
async function loadData(){
  let v=await raw.get(K3);
  if(v){try{data=JSON.parse(v);}catch(e){}}
  else{const v2=await raw.get(K2);
    if(v2){try{const o=JSON.parse(v2);data=migrateFlat(o.logs||{},o.pool||{});await raw.set(K3,JSON.stringify(data));}catch(e){}}
    else{const v1=await raw.get(K1);if(v1){try{const o=JSON.parse(v1);data=migrateFlat({A:o.A,B:o.B,C:o.C},o.POOL||{});await raw.set(K3,JSON.stringify(data));}catch(e){}}}}
  data.days=data.days||{};data.hidden=data.hidden||{};
}
let st=null;function queueSave(){clearTimeout(st);st=setTimeout(()=>raw.set(K3,JSON.stringify(data)),350);}
function flush(){clearTimeout(st);raw.set(K3,JSON.stringify(data));}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});

function recOf(dt,sid,id){const s=(data.days[dt]||{})[sid];return s?s[id]:undefined;}
function ensureRec(dt,sid,id){data.days[dt]=data.days[dt]||{};data.days[dt][sid]=data.days[dt][sid]||{};return data.days[dt][sid][id]=data.days[dt][sid][id]||{sets:[{},{},{}]};}
function filled(rec){return rec&&rec.sets&&rec.sets.some(s=>s.a||s.b);}
function metaHasData(dt,sid){const mm=(data.days[dt]&&data.days[dt].meta&&data.days[dt].meta[sid])||{};return !!(mm.dur||mm.kcal||mm.hr);}
function getMeta(dt,sid){return (data.days[dt]&&data.days[dt].meta&&data.days[dt].meta[sid])||{};}
function setMeta(dt,sid,f,v){data.days[dt]=data.days[dt]||{};data.days[dt].meta=data.days[dt].meta||{};data.days[dt].meta[sid]=data.days[dt].meta[sid]||{};if(v)data.days[dt].meta[sid][f]=v;else delete data.days[dt].meta[sid][f];queueSave();}
function daySessions(dt){const d=data.days[dt]||{};return SKEYS.filter(k=>k==='POOL'?((d.POOL&&d.POOL.largos)||metaHasData(dt,'POOL')):((d[k]&&Object.values(d[k]).some(filled))||metaHasData(dt,k)));}
function prevRecord(sid,id,before){const ds=Object.keys(data.days).filter(d=>d<before).sort().reverse();for(const d of ds){const r=(data.days[d][sid]||{})[id];if(filled(r))return{date:d,rec:r};}return null;}
function shiftDate(k,delta){const d=new Date(k+'T12:00');d.setDate(d.getDate()+delta);return dkey(d);}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function topRep(scheme,type){if(type==='time')return null;const seg=scheme.split('×')[1]||'';const nums=(seg.match(/\d+/g)||[]).map(Number);if(!nums.length)return null;return nums.length>1?nums[1]:nums[0];}
function needUp(it,type,prev){if(type==='time')return false;const top=topRep(it.scheme,type);if(!top||!prev)return false;const f=type==='weight'?'b':'a';const done=prev.rec.sets.filter(s=>s[f]);if(done.length<2)return false;return done.every(s=>(parseInt(s[f])||0)>=top);}
function isHidden(sid,id){return !!data.hidden[sid+'|'+id];}
function lastMeta(sid){const ds=Object.keys(data.days).sort();let out=null;ds.forEach(dt=>{const mm=(data.days[dt].meta||{})[sid];if(mm&&(mm.dur||mm.kcal||mm.hr))out={dur:mm.dur,kcal:mm.kcal,hr:mm.hr,date:dt};});return out;}
function lastPool(){const ds=Object.keys(data.days).sort();let out=null;ds.forEach(dt=>{const p=data.days[dt].POOL;const mm=(data.days[dt].meta||{}).POOL;if((p&&p.largos)||(mm&&(mm.dur||mm.kcal||mm.hr)))out={largos:p&&p.largos,date:dt};});return out;}
function metaLine(sid,largos){const mm=lastMeta(sid);const parts=[];if(largos)parts.push(`🏊 <b>${largos}</b> largos`);
  if(mm){if(mm.dur)parts.push(`⏱ <b>${mm.dur}</b> min`);if(mm.kcal)parts.push(`🔥 <b>${mm.kcal}</b> kcal`);if(mm.hr)parts.push(`❤ <b>${mm.hr}</b> ppm`);}
  if(!parts.length)return'';const dt=(mm&&mm.date)||'';const dd=dt?new Date(dt+'T12:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}):'';
  return `<div class="metaline">${parts.join(' · ')}${dd?` <span style="opacity:.7">(${dd})</span>`:''}</div>`;}

function dateBar(){const isToday=activeDate===todayKey();

function renderEntreno(){
  const S=SESSIONS[current];

  h+=`<div class="subtabs">`+SKEYS.map(k=>{const cls=k==='A'?'a':k==='B'?'b':k==='C'?'c':'p';return `<button class="tab ${cls} ${k===current?'on '+cls:''}" data-sess="${k}">${SNAME[k]}</button>`;}).join('')+`</div>`;
  h+=sessStatsHTML(current);

  h+=`<div class="meta"><div class="sub">${S.name}</div><div class="prog" id="prog"></div></div>`;
  visible.forEach(it=>{const type=it.type||'weight';const rec=recOf(activeDate,current,it.id);if(filled(rec))cnt++;h+=exHTML(it,type,rec);});
  if(hidden.length){h+=`<div class="hidden-sec"><h4>Ocultos (${hidden.length})</h4>`+hidden.map(it=>`<div class="hidden-row"><span>${it.name}</span><button data-show="${it.id}">Mostrar</button></div>`).join('')+`</div>`;}
  h+=noteHTML();

  viewEl.innerHTML=h;const pr=document.getElementById('prog');if(pr)pr.innerHTML=`<b>${cnt}</b>/${visible.length} registrados`;

function sessStatsHTML(sid){const mm=getMeta(activeDate,sid);
  return `<div class="sstats">
    <div class="sf"><label>Duración (min)</label><input data-meta="dur" inputmode="numeric" value="${mm.dur||''}" aria-label="Duración en minutos" placeholder="—"></div>
    <div class="sf"><label>Calorías (kcal)</label><input data-meta="kcal" inputmode="numeric" value="${mm.kcal||''}" aria-label="Calorías quemadas" placeholder="—"></div>
    <div class="sf"><label>Puls. media (ppm)</label><input data-meta="hr" inputmode="numeric" value="${mm.hr||''}" aria-label="Pulsaciones medias" placeholder="—"></div></div>`;}
function exHTML(it,type,rec){
  const n=rec&&rec.sets&&rec.sets.length?rec.sets.length:3;
  const badges=it.p.map(k=>`<span class="bdg p">${LBL[k]}</span>`).join('')+it.s.map(k=>`<span class="bdg s">${LBL[k]}</span>`).join('');
  let head,rows='';
  if(type==='weight')head=`<div class="set-head"><span></span><span>Peso (kg)</span><span>Reps</span></div>`;
  else head=`<div class="set-head solo"><span></span><span>${type==='time'?'Segundos':'Reps'}</span></div>`;
  for(let i=0;i<n;i++){const s=(rec&&rec.sets&&rec.sets[i])||{};const a=s.a||'',b=s.b||'';
    if(type==='weight'){
      rows+=`<div class="set" data-i="${i}"><span class="n">${i+1}</span>
        <input inputmode="decimal" data-f="a" value="${a}" aria-label="Peso serie ${i+1}" placeholder="—">
        <div class="stp"><button data-step="-1" aria-label="menos">−</button>
          <input inputmode="numeric" data-f="b" value="${b}" aria-label="Reps serie ${i+1}" placeholder="—">
          <button data-step="1" aria-label="más">+</button></div></div>`;
    }else{
      rows+=`<div class="set solo" data-i="${i}"><span class="n">${i+1}</span>
        <div class="stp"><button data-step="-1" aria-label="menos">−</button>
          <input inputmode="numeric" data-f="a" value="${a}" aria-label="Serie ${i+1}" placeholder="—">
          <button data-step="1" aria-label="más">+</button></div></div>`;}}
  const prev=prevRecord(current,it.id,activeDate);
  let lastLine='';
  if(prev){const p=prev.rec.sets.map(s=>type==='weight'?((s.a?s.a+'kg':'—')+'×'+(s.b||'—')):type==='time'?(s.a?s.a+'s':'—'):(s.a||'—'));
    const dd=new Date(prev.date+'T12:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'});lastLine=`Anterior (${dd}): <b>${p.join('  ·  ')}</b>`;}
  const up=needUp(it,type,prev);
  const restSec=it.rest||90;
  const restLbl=restSec>=150?'2-3 min':restSec>=90?'90 s':restSec>=75?'60-90 s':'60 s';
  const rirTag=type==='time'?'':'<span class="rtag">🎯 RIR 1-3</span>';
  const recRow=`<div class="rec">${rirTag}<button class="rest-tag rtag" data-rest="${restSec}">⏱ Descanso ${restLbl}</button><a class="rtag demo" href="https://www.youtube.com/results?search_query=${encodeURIComponent((it.q||it.name)+' técnica')}" target="_blank" rel="noopener">▶ Cómo se hace</a></div>`;
  return `<div class="ex${up?' up':''}" data-p="${it.p.join(' ')}" data-s="${it.s.join(' ')}" data-id="${it.id}" data-type="${type}">
    <div class="ex-top">${FIGS}<div class="ex-info"><div class="ex-name">${it.name}${up?'<span class="up-badge">↑ sube peso</span>':''}</div>
    <span class="scheme">${it.scheme}</span><div class="badges">${badges}</div></div></div>
    <div class="cue${it.warn?' warn':''}">${it.cue}</div>
    ${recRow}
    <div class="sets">${head}${rows}</div>

    <div class="last">${lastLine}</div></div>`;
}
function poolHTML(){const rec=(data.days[activeDate]||{}).POOL||{};
  return `<div class="pool-card"><h3>🏊 Natación</h3>
    <ul class="pool-list"><li>Calienta 4-5 min nadando suave para soltar.</li>

function readCard(card){const id=card.dataset.id;const rec=ensureRec(activeDate,current,id);const sets=[];
  card.querySelectorAll('.set').forEach(row=>{const o={};row.querySelectorAll('input').forEach(inp=>{if(inp.value)o[inp.dataset.f]=inp.value;});sets.push(o);});

function bindEntreno(){

  viewEl.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{current=t.dataset.sess;renderEntreno();});
  viewEl.querySelectorAll('.sstats input').forEach(inp=>inp.addEventListener('input',()=>setMeta(activeDate,current,inp.dataset.meta,inp.value)));
  const pi=document.getElementById('poolInput');
  if(pi)pi.addEventListener('input',e=>{data.days[activeDate]=data.days[activeDate]||{};data.days[activeDate].POOL={largos:e.target.value};queueSave();});
  const nb=document.getElementById('noteBox');
  if(nb)nb.addEventListener('input',e=>{data.days[activeDate]=data.days[activeDate]||{};const v=e.target.value;if(v)data.days[activeDate].note=v;else delete data.days[activeDate].note;queueSave();});

  viewEl.querySelectorAll('.ex').forEach(card=>{

    card.querySelectorAll('.stp button').forEach(btn=>btn.addEventListener('click',()=>{
      const inp=btn.parentElement.querySelector('input');let v=parseInt(inp.value||'0',10);if(isNaN(v))v=0;v=Math.max(0,v+parseInt(btn.dataset.step,10));
      inp.value=v;inp.classList.toggle('filled',!!inp.value);readCard(card);updateProg();}));
    card.querySelector('[data-act="add"]').addEventListener('click',()=>{readCard(card);ensureRec(activeDate,current,card.dataset.id).sets.push({});queueSave();renderEntreno();});
    card.querySelector('[data-act="del"]').addEventListener('click',()=>{readCard(card);const r=ensureRec(activeDate,current,card.dataset.id);if(r.sets.length>1)r.sets.pop();queueSave();renderEntreno();});

    const rt=card.querySelector('.rest-tag');if(rt)rt.addEventListener('click',()=>startRest(parseInt(rt.dataset.rest,10)));
  });
  viewEl.querySelectorAll('.set input').forEach(i=>i.classList.toggle('filled',!!i.value));
}
function updateProg(){const p=document.getElementById('prog');if(!p)return;const S=SESSIONS[current];const vis=S.items.filter(it=>!isHidden(current,it.id));let f=0;

  const monName=calMonth.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let h=`<div class="cal-head"><button data-mv="-1" aria-label="Mes anterior">‹</button><div class="mon">${monName}</div><button data-mv="1" aria-label="Mes siguiente">›</button></div>`;
  h+=`<div class="cal-grid">`+['L','M','X','J','V','S','D'].map(d=>`<div class="cal-wd">${d}</div>`).join('');
  for(let i=0;i<start;i++)h+=`<div class="cal-cell empty"></div>`;
  const tk=todayKey();
  for(let d=1;d<=days;d++){const key=`${y}-${pad(m+1)}-${pad(d)}`;const sess=daySessions(key);const dots=sess.map(s=>`<i style="background:${SCOL[s]}"></i>`).join('');
    h+=`<div class="cal-cell${sess.length?' has':''}${key===tk?' today':''}${key===selDay?' sel':''}" data-day="${key}"><span class="dnum">${d}</span><div class="cal-dots">${dots}</div></div>`;}
  h+=`</div>`;
  if(selDay)h+=dayPreview(selDay);
  else h+=`<div class="cal-hint">Toca un día para ver lo que hiciste.<br>Los puntos de color son las sesiones registradas.</div>`;
  viewEl.innerHTML=h;
  viewEl.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{calMonth=new Date(y,m+parseInt(b.dataset.mv,10),1);renderCalendar();});
  viewEl.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{selDay=(selDay===c.dataset.day?null:c.dataset.day);renderCalendar();});
  const ob=viewEl.querySelector('[data-open]');if(ob)ob.onclick=()=>{activeDate=ob.dataset.open;const sess=daySessions(activeDate).filter(s=>s!=='POOL');if(sess.length)current=sess[0];view='entreno';render();};
}
function dayPreview(dt){
  const sess=daySessions(dt);
  const dd=cap(new Date(dt+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}));
  let inner='';
  sess.forEach(sid=>{
    if(sid==='POOL'){const p=(data.days[dt].POOL||{});const mm=getMeta(dt,'POOL');const bits=[];if(p.largos)bits.push(`${p.largos} largos`);if(mm.dur)bits.push(`${mm.dur} min`);if(mm.kcal)bits.push(`${mm.kcal} kcal`);if(mm.hr)bits.push(`${mm.hr} ppm`);
      inner+=`<div class="cp-sess" style="color:${SCOL.POOL}">🏊 Piscina</div><div class="cp-ex"><span>${bits.join(' · ')||'—'}</span><span></span></div>`;
    }else{const s=data.days[dt][sid]||{};const mm=getMeta(dt,sid);const metaBits=[];if(mm.dur)metaBits.push(`${mm.dur} min`);if(mm.kcal)metaBits.push(`${mm.kcal} kcal`);if(mm.hr)metaBits.push(`${mm.hr} ppm`);
      inner+=`<div class="cp-sess" style="color:${SCOL[sid]}">${SESSIONS[sid].name}${metaBits.length?` · ${metaBits.join(' · ')}`:''}</div>`;
      SESSIONS[sid].items.forEach(it=>{const r=s[it.id];if(filled(r)){const type=it.type||'weight';const parts=r.sets.map(x=>type==='weight'?((x.a?x.a+'kg':'—')+'×'+(x.b||'—')):type==='time'?(x.a?x.a+'s':'—'):(x.a||'—'));inner+=`<div class="cp-ex"><span>${it.name}</span><span>${parts.join(' · ')}</span></div>`;}});
    }});
  if((data.days[dt]||{}).post)inner+=`<div class="cp-sess" style="color:var(--good)">✓ Recuperación / estiramientos</div>`;
  const note=(data.days[dt]||{}).note;if(note)inner+=`<div class="cp-note">📝 ${note.replace(/</g,'&lt;')}</div>`;
  if(!inner)inner=`<p class="cp-empty">Nada registrado este día.</p>`;
  return `<div class="cal-prev"><h3>${dd}</h3>${inner}<button class="cp-open" data-open="${dt}">Abrir en Entreno</button></div>`;
}

const POST={
 A:[{name:'Pecho en marco de puerta',sub:'Antebrazo apoyado en el marco, gira el cuerpo. 30 s/lado',dur:30,q:'estiramiento de pecho en marco de puerta'},
    {name:'Hombro cruzado',sub:'Brazo cruzado al pecho, tira con el otro. 30 s/lado',dur:30,q:'estiramiento de hombro cruzado'},
    {name:'Tríceps sobre la cabeza',sub:'Codo arriba, empuja suave con la otra mano. 30 s/lado',dur:30,q:'estiramiento de tríceps sobre la cabeza'},
    {name:'Cuello lateral',sub:'Inclina la oreja al hombro, muy suave. 20 s/lado',dur:20,q:'estiramiento de cuello lateral'}],
 B:[{name:'Colgarse de la barra',sub:'Cuelga relajado y estira el dorsal. 30 s',dur:30,q:'colgarse de la barra estiramiento dorsal'},
    {name:'Dorsal lateral',sub:'Brazo arriba, inclínate al lado contrario. 30 s/lado',dur:30,q:'estiramiento de dorsal lateral de pie'},
    {name:'Bíceps en pared',sub:'Brazo estirado atrás, palma en la pared. 30 s/lado',dur:30,q:'estiramiento de bíceps en la pared'},
    {name:'Gato-camello',sub:'A cuatro patas, arquea y redondea la espalda. 8-10 lentas',dur:30,q:'ejercicio gato camello movilidad'}],
 C:[{name:'Cuádriceps de pie',sub:'Talón al glúteo, rodillas juntas. 30 s/lado',dur:30,q:'estiramiento de cuádriceps de pie'},
    {name:'Isquios',sub:'Pierna estirada, inclina el tronco hacia ella. 30 s/lado',dur:30,q:'estiramiento de isquiotibiales'},
    {name:'Glúteo (figura 4)',sub:'Tumbado, tobillo sobre la rodilla y tira. 30 s/lado',dur:30,q:'estiramiento de glúteo figura 4'},
    {name:'Gemelo en pared',sub:'Pierna atrás estirada, talón al suelo. 30 s/lado',dur:30,q:'estiramiento de gemelo en la pared'},
    {name:'Flexor de cadera',sub:'Zancada baja, empuja la cadera adelante. 30 s/lado',dur:30,q:'estiramiento de flexor de cadera zancada'}]
};
function renderPost(){
  const done=!!((data.days[todayKey()]||{}).post);
  const map={A:'Empuje',B:'Tirón',C:'Pierna'};
  let h=`<div class="subtabs">`+['A','B','C'].map(k=>{const cls=k==='A'?'a':k==='B'?'b':'c';return `<button class="tab ${cls} ${k===postSel?'on '+cls:''}" data-post="${k}">${map[k]}</button>`;}).join('')+`</div>`;
  h+=`<div class="post-note"><b>Vuelta a la calma</b> · 3-5 min andando o en bici suave para bajar pulsaciones, y 5 respiraciones lentas (inhala 4 s, exhala 6 s). Luego estira sin rebotes, aguantando cada posición 20-30 s sin dolor. Toca ▶ para cronometrar cada uno.</div>`;
  (POST[postSel]||[]).forEach(s=>{h+=`<div class="post-item"><div class="pi-info"><div class="pi-name">${s.name}</div><div class="pi-sub">${s.sub}</div></div><div class="pi-btns"><a class="pi-go img" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(s.q)}" target="_blank" rel="noopener" aria-label="Ver imagen">🖼</a><button class="pi-go" data-sec="${s.dur}">▶ ${s.dur}s</button></div></div>`;});
  h+=`<button class="post-done${done?' on':''}" data-done="1">${done?'✓ Recuperación hecha hoy':'Marcar recuperación hecha (hoy)'}</button>`;
  viewEl.innerHTML=h;
  viewEl.querySelectorAll('[data-post]').forEach(b=>b.onclick=()=>{postSel=b.dataset.post;renderPost();});
  viewEl.querySelectorAll('.pi-go').forEach(b=>b.onclick=()=>startRest(parseInt(b.dataset.sec,10)));
  viewEl.querySelector('[data-done]').onclick=()=>{const dt=todayKey();data.days[dt]=data.days[dt]||{};if(data.days[dt].post)delete data.days[dt].post;else data.days[dt].post=true;queueSave();renderPost();};
  updateRestBar();
}
function renderResumen(){
  const now=new Date();const ws=new Date(now);ws.setDate(now.getDate()-((now.getDay()+6)%7));ws.setHours(0,0,0,0);
  const mk=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  let weekDays=0,monthSess=0,totalSess=0,monthMin=0,monthKcal=0;
  Object.keys(data.days).forEach(dt=>{const sess=daySessions(dt);totalSess+=sess.length;if(dt.startsWith(mk))monthSess+=sess.length;
    const d=new Date(dt+'T12:00');if(d>=ws&&d<=now&&sess.length)weekDays++;
    if(dt.startsWith(mk)){const mt=(data.days[dt].meta)||{};Object.values(mt).forEach(mm=>{monthMin+=parseInt(mm.dur)||0;monthKcal+=parseInt(mm.kcal)||0;});}});
  let h=`<div class="stat-row">
    <div class="stat"><div class="big">${weekDays}</div><div class="lbl">días esta semana</div></div>
    <div class="stat"><div class="big">${monthSess}</div><div class="lbl">sesiones este mes</div></div>
    <div class="stat"><div class="big">${totalSess}</div><div class="lbl">sesiones total</div></div></div>
    <div class="stat-row">
    <div class="stat"><div class="big">${monthMin}</div><div class="lbl">min este mes</div></div>
    <div class="stat"><div class="big">${monthKcal}</div><div class="lbl">kcal este mes</div></div></div>`;
  ['A','B','C'].forEach(sid=>{let rows='';
    SESSIONS[sid].items.forEach(it=>{const type=it.type||'weight';const ds=Object.keys(data.days).sort();let lastRec=null,best=0;
      ds.forEach(dt=>{const r=(data.days[dt][sid]||{})[it.id];if(filled(r)){lastRec=r;if(type==='weight')r.sets.forEach(s=>{const v=parseFloat(s.a)||0;if(v>best)best=v;});}});
      let last='—',bestTxt='';
      if(lastRec){const parts=lastRec.sets.map(s=>type==='weight'?((s.a?s.a+'kg':'—')+'×'+(s.b||'—')):type==='time'?(s.a?s.a+'s':'—'):(s.a||'—'));last=parts.join(' · ');if(best>0)bestTxt=` · máx ${best}kg`;}
      rows+=`<div class="sumrow"><span class="nm">${it.name}</span><span class="vl"><b>${last}</b>${bestTxt}</span></div>`;});
    h+=`<div class="sumsec"><h3><i style="background:${SCOL[sid]}"></i>${SESSIONS[sid].name}</h3>${metaLine(sid)}${rows}</div>`;});
  const pm=lastPool();if(pm)h+=`<div class="sumsec"><h3><i style="background:${SCOL.POOL}"></i>Piscina</h3>${metaLine('POOL',pm.largos)}</div>`;
  h+=`<div class="backup"><h3>Copia de seguridad</h3>
    <p>Guarda este texto en sitio seguro (notas, email…). Restáuralo aquí si cambias de móvil o se pierden los datos.</p>
    <textarea id="expBox" readonly>${escapeHtml(JSON.stringify(data))}</textarea>
    <div class="bbtns"><button id="copyBtn">Copiar</button><button id="dlBtn">Descargar</button></div>
    <p>Pega aquí una copia para restaurar:</p><textarea id="impBox" placeholder='{"days":...}'></textarea>
    <div class="bbtns"><button id="impBtn">Restaurar copia</button></div><div class="bmsg" id="bmsg"></div></div>`;
  viewEl.innerHTML=h;
  document.getElementById('copyBtn').onclick=async()=>{const t=document.getElementById('expBox');try{await navigator.clipboard.writeText(t.value);msg('Copiado ✓');}catch(e){t.select();document.execCommand('copy');msg('Copiado ✓');}};
  document.getElementById('dlBtn').onclick=()=>{try{const b=new Blob([document.getElementById('expBox').value],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='mi-entreno-backup.json';a.click();URL.revokeObjectURL(u);msg('Descargando ✓');}catch(e){msg('No se pudo; usa Copiar',1);}};
  document.getElementById('impBtn').onclick=()=>{const v=document.getElementById('impBox').value.trim();if(!v){msg('Pega una copia primero',1);return;}
    try{const o=JSON.parse(v);if(!o.days)throw 0;data=o;data.days=data.days||{};data.hidden=data.hidden||{};raw.set(K3,JSON.stringify(data));msg('Datos restaurados ✓');setTimeout(()=>renderResumen(),600);}catch(e){msg('Copia no válida',1);}};
}
function msg(t,err){const m=document.getElementById('bmsg');if(!m)return;m.textContent=t;m.className='bmsg'+(err?' err':'');}
function escapeHtml(s){return s.replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---- temporizador de descanso ---- */
let rInt=null,rLeft=0;
function fmtT(s){return Math.floor(s/60)+':'+pad(Math.max(0,s%60));}
function restShow(run){document.querySelector('#rest .rest-idle').classList.toggle('hide',run);document.querySelector('#rest .rest-run').classList.toggle('hide',!run);}
function updRestNum(){const n=document.getElementById('restNum');if(n)n.textContent=fmtT(rLeft);}
function startRest(sec){if(rInt)clearInterval(rInt);rLeft=sec;restShow(true);updRestNum();rInt=setInterval(()=>{rLeft--;if(rLeft<=0)finishRest();else updRestNum();},1000);}
function stopRest(){if(rInt){clearInterval(rInt);rInt=null;}restShow(false);}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;o.start();g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.4);o.stop(c.currentTime+.42);}catch(e){}}
function finishRest(){if(rInt){clearInterval(rInt);rInt=null;}beep();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}const n=document.getElementById('restNum');if(n)n.textContent='¡Ya!';setTimeout(()=>restShow(false),1500);}
function updateRestBar(){const r=document.getElementById('rest');if(!r)return;r.classList.toggle('hide',!((view==='entreno'&&current!=='POOL')||view==='post'));}
document.querySelectorAll('#rest [data-rest]').forEach(b=>b.onclick=()=>startRest(parseInt(b.dataset.rest,10)));
document.getElementById('restStop').onclick=()=>stopRest();
document.getElementById('restAdd').onclick=()=>{rLeft+=15;updRestNum();};

(async()=>{await loadData();render();})();
</script>
